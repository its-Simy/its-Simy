name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"   # once every 24 hours, around midnight New York time
  workflow_dispatch:      # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in Actions token, no PAT needed
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py
      - name: Commit
        run: |-
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Updated README stats" || echo "No changes to commit"
          git push
