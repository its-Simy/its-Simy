name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF3B3B&color_dots=#ebedf0,#cfe8fc,#93c5fd,#60a5fa,#2563eb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF3B3B&color_dots=#161b22,#1e3a5f,#2b6cb0,#63b3ed,#e0f2fe

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
