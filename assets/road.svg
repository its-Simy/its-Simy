<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Race car speeding across a track">
  <defs>
    <clipPath id="card"><rect width="1200" height="140" rx="20"/></clipPath>
    <pattern id="kerb" width="40" height="8" patternUnits="userSpaceOnUse">
      <rect width="20" height="8" fill="#FF3B3B"/>
      <rect x="20" width="20" height="8" fill="#F8FAFC"/>
    </pattern>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#F8FAFC"/>
      <rect width="8" height="8" fill="#0B1220"/>
      <rect x="8" y="8" width="8" height="8" fill="#0B1220"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A5A"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <style>
    .lbl{font:700 13px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:3px}
    .lane{stroke-dasharray:28 22;animation:lane .6s linear infinite}
    @keyframes lane{to{stroke-dashoffset:50}}
    .kerb{animation:kerb .6s linear infinite}
    @keyframes kerb{to{transform:translateX(-40px)}}
    .bob{animation:bob .25s ease-in-out infinite alternate}
    @keyframes bob{to{transform:translateY(-1.5px)}}
    .sl{stroke:#7DD3FC;stroke-linecap:round;animation:sl .4s linear infinite}
    @keyframes sl{0%{opacity:0;transform:translateX(10px)}50%{opacity:.9}100%{opacity:0;transform:translateX(-30px)}}
    .flame{fill:#F59E0B;transform-box:fill-box;transform-origin:right center;animation:fl .12s ease-in-out infinite alternate}
    @keyframes fl{from{transform:scaleX(.6)}to{transform:scaleX(1.2)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="140" fill="url(#bg)"/>
    <circle class="blink" cx="40" cy="26" r="4" fill="#FF3B3B"/>
    <text class="lbl" x="54" y="31" fill="#94A3B8">LAP 01 · BACKEND GRAND PRIX</text>
    <text class="lbl" x="1160" y="31" fill="#FF3B3B" text-anchor="end">0 → 60 IN ONE COMMIT</text>

    <!-- track -->
    <rect y="50" width="1200" height="72" fill="#1F2937"/>
    <g class="kerb"><rect y="50" width="1280" height="8" fill="url(#kerb)"/></g>
    <g class="kerb"><rect y="114" width="1280" height="8" fill="url(#kerb)"/></g>
    <line class="lane" x1="0" y1="86" x2="1200" y2="86" stroke="#FDE047" stroke-width="3" stroke-opacity=".8"/>
    <rect x="1060" y="58" width="16" height="56" fill="url(#checker)"/>

    <!-- car -->
    <g>
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M-180 110 L1380 110"/>
      <ellipse cx="0" cy="1" rx="74" ry="4" fill="#000" opacity=".4"/>
      <g class="bob">
        <polygon points="76,-21 170,-38 170,-4" fill="#FDE047" opacity=".12"/>
        <line class="sl" x1="-92" y1="-36" x2="-132" y2="-36" stroke-width="2.5"/>
        <line class="sl" x1="-98" y1="-24" x2="-156" y2="-24" stroke-width="2" style="animation-delay:-.13s"/>
        <line class="sl" x1="-90" y1="-12" x2="-124" y2="-12" stroke-width="2" style="animation-delay:-.26s"/>
        <path class="flame" d="M-72 -15 L-88 -12 L-72 -9 Z"/>
        <path d="M-64 -26 L-63 -30" stroke="#0B1220" stroke-width="3"/>
        <rect x="-76" y="-34" width="22" height="4" rx="1" fill="#0B1220"/>
        <path fill="url(#paint)" d="M-72 -8 L-71 -22 Q-64 -28 -44 -30 L-22 -31 Q-6 -48 14 -48 Q32 -48 46 -33 L66 -28 Q76 -25 76 -16 L74 -8 Z"/>
        <path fill="url(#glass)" opacity=".9" d="M-17 -32 Q-4 -45 13 -45 Q29 -45 40 -33 Z"/>
        <line x1="10" y1="-45" x2="10" y2="-32" stroke="#B91C1C" stroke-width="3"/>
        <line x1="-68" y1="-17" x2="72" y2="-17" stroke="#F8FAFC" stroke-width="2.5" opacity=".9"/>
        <circle cx="-6" cy="-21" r="7.5" fill="#F8FAFC"/>
        <text x="-6" y="-18" text-anchor="middle" style="font:800 8px 'Segoe UI',Arial,sans-serif" fill="#B91C1C">SR</text>
        <path d="M67 -25 L75 -22 L74 -19 L66 -22 Z" fill="#FDE047"/>
        <rect x="-73" y="-21" width="4" height="4" rx="1" fill="#F97316"/>
        <circle cx="-46" cy="-11" r="14" fill="#1F2937"/>
        <circle cx="48" cy="-11" r="14" fill="#1F2937"/>
        <g transform="translate(-46 -11)">
          <circle r="11" fill="#0B0F19"/>
          <circle r="6" fill="#CBD5E1"/>
          <g stroke="#475569" stroke-width="2">
            <line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".3s" repeatCount="indefinite"/>
          </g>
        </g>
        <g transform="translate(48 -11)">
          <circle r="11" fill="#0B0F19"/>
          <circle r="6" fill="#CBD5E1"/>
          <g stroke="#475569" stroke-width="2">
            <line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".3s" repeatCount="indefinite"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
