<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Simon Ramirez — snowboarder carving down a moonlit mountain">
  <defs>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050913"/>
      <stop offset=".6" stop-color="#12224A"/>
      <stop offset="1" stop-color="#2B4A7E"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F7FE"/>
      <stop offset="1" stop-color="#A9C6EC"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity=".45"/>
      <stop offset="1" stop-color="#E0F2FE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>
    <g id="tree">
      <polygon points="0,-48 -12,-26 -6,-26 -17,-6 -4,-6 -4,2 4,2 4,-6 17,-6 6,-26 12,-26" fill="#0B1730"/>
      <polygon points="0,-48 -6,-37 0,-39 6,-37" fill="#E2E8F0"/>
    </g>
  </defs>

  <style>
    .t{font:900 64px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:6px;animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
    .sub{font:600 20px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:4px;fill:#BAE6FD;animation:in 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
    .tag{font:500 15px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:2px;fill:#FCA5A5;animation:in 1.2s .6s cubic-bezier(.2,.8,.2,1) both}
    @keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
    .aur{animation:glow 8s ease-in-out infinite alternate}
    @keyframes glow{from{opacity:.18}to{opacity:.5}}
    .s{fill:#fff;animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .f{fill:#fff;opacity:.85;animation:fall linear infinite}
    @keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(40px,380px)}}
    .spray{fill:#fff;animation:spray .5s linear infinite}
    @keyframes spray{from{opacity:.9;transform:translate(0,0)}to{opacity:0;transform:translate(14px,-8px)}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#sky)"/>
    <path class="aur" filter="url(#blur)" fill="url(#aurora)" d="M0 70 C250 10 450 120 700 50 S1050 20 1200 70 L1200 120 C1000 80 800 160 600 100 S200 80 0 130 Z"/>

    <!-- stars -->
    <circle class="s" cx="520" cy="40" r="1.2"/>
    <circle class="s" cx="610" cy="90" r="1" style="animation-delay:-.6s"/>
    <circle class="s" cx="700" cy="30" r="1.4" style="animation-delay:-1.2s"/>
    <circle class="s" cx="760" cy="110" r=".9" style="animation-delay:-1.8s"/>
    <circle class="s" cx="840" cy="55" r="1.1" style="animation-delay:-2.4s"/>
    <circle class="s" cx="900" cy="20" r="1" style="animation-delay:-.3s"/>
    <circle class="s" cx="960" cy="120" r=".8" style="animation-delay:-.9s"/>
    <circle class="s" cx="1140" cy="40" r="1.2" style="animation-delay:-1.5s"/>
    <circle class="s" cx="1170" cy="130" r=".9" style="animation-delay:-2.1s"/>
    <circle class="s" cx="450" cy="110" r=".8" style="animation-delay:-2.7s"/>
    <circle class="s" cx="40" cy="30" r="1" style="animation-delay:-1s"/>
    <circle class="s" cx="300" cy="25" r="1" style="animation-delay:-2s"/>
    <circle class="s" cx="980" cy="75" r="1.3" style="animation-delay:-.4s"/>
    <circle class="s" cx="660" cy="140" r=".8" style="animation-delay:-1.3s"/>

    <!-- moon -->
    <circle cx="1060" cy="78" r="80" fill="url(#moonGlow)"/>
    <circle cx="1060" cy="78" r="26" fill="#F1F5F9"/>
    <circle cx="1051" cy="71" r="4" fill="#CBD5E1"/>
    <circle cx="1068" cy="88" r="3" fill="#CBD5E1"/>
    <circle cx="1066" cy="68" r="2" fill="#CBD5E1"/>

    <!-- far range -->
    <g transform="translate(0 40)">
      <polygon fill="#24375F" points="0,260 120,170 210,230 330,130 450,240 560,160 680,250 800,140 930,230 1040,150 1200,240 1200,360 0,360"/>
      <g fill="#C7D7F0">
        <polygon points="91,192 120,170 153,192 140,186 128,195 112,185 100,194"/>
        <polygon points="292,162 330,130 365,162 352,155 340,167 325,154 310,166"/>
        <polygon points="527,184 560,160 592,184 580,178 568,188 552,177 540,187"/>
        <polygon points="767,170 800,140 843,170 830,163 816,174 800,162 785,173"/>
        <polygon points="1004,176 1040,150 1086,176 1072,169 1058,180 1040,168 1022,179"/>
      </g>
    </g>

    <!-- mid range -->
    <polygon fill="#172645" points="0,300 160,240 300,295 470,215 640,300 760,250 900,310 1200,290 1200,360 0,360"/>

    <!-- left ridge + pines -->
    <path fill="url(#snow)" d="M0 326 Q220 296 470 360 L0 360 Z"/>
    <use href="#tree" transform="translate(53 324) scale(.9)"/>
    <use href="#tree" transform="translate(98 321) scale(1.15)"/>
    <use href="#tree" transform="translate(144 320) scale(.95)"/>
    <use href="#tree" transform="translate(275 328) scale(.8)"/>
    <use href="#tree" transform="translate(323 334) scale(.7)"/>

    <!-- slope -->
    <path fill="url(#snow)" d="M1200 200 Q950 230 760 310 Q690 340 640 360 L1200 360 Z"/>
    <path d="M1200 200 Q950 230 760 310 Q690 340 640 360" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>

    <!-- board track drawn behind the rider -->
    <path d="M1200 200 Q950 230 760 310 Q690 340 640 360" transform="translate(0 4)" fill="none" stroke="#7FA3D1" stroke-width="2" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;.92;1" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- snowboarder -->
    <g>
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto-reverse" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.92;1" path="M1200 200 Q950 230 760 310 Q690 340 640 360"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.85;.92;1" dur="6s" repeatCount="indefinite"/>
      <circle class="spray" cx="24" cy="-3" r="2.5"/>
      <circle class="spray" cx="28" cy="-6" r="2" style="animation-delay:-.15s"/>
      <circle class="spray" cx="22" cy="-8" r="1.6" style="animation-delay:-.3s"/>
      <rect x="-24" y="-5" width="48" height="5" rx="2.5" fill="#FF3B3B"/>
      <path d="M-9 -5 L-6 -13 L-1 -20 M9 -5 L6 -13 L2 -20" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 -20 L-4 -33" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round"/>
      <path d="M-3 -30 L-16 -25 M-3 -30 L11 -31" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-5" cy="-39" r="5" fill="#F8FAFC"/>
      <rect x="-10" y="-41" width="6" height="3" rx="1.5" fill="#F59E0B"/>
    </g>

    <!-- name -->
    <g filter="url(#shadow)">
      <text class="t" x="60" y="104" fill="url(#title)">SIMON RAMIREZ</text>
      <text class="sub" x="63" y="142">COMPUTER SCIENCE @ STONY BROOK</text>
      <text class="tag" x="63" y="174">// backend dev · gearhead · snowboarder</text>
    </g>

    <!-- snowfall -->
    <circle class="f" cx="20" cy="0" r="1.2" style="animation-duration:9s;animation-delay:-1s"/>
    <circle class="f" cx="70" cy="0" r="2" style="animation-duration:12s;animation-delay:-7s"/>
    <circle class="f" cx="115" cy="0" r="1.5" style="animation-duration:8s;animation-delay:-3s"/>
    <circle class="f" cx="160" cy="0" r="2.6" style="animation-duration:14s;animation-delay:-11s"/>
    <circle class="f" cx="205" cy="0" r="1.8" style="animation-duration:10s;animation-delay:-5s"/>
    <circle class="f" cx="250" cy="0" r="1.2" style="animation-duration:11s;animation-delay:-9s"/>
    <circle class="f" cx="290" cy="0" r="2.2" style="animation-duration:7s;animation-delay:-2s"/>
    <circle class="f" cx="335" cy="0" r="1.5" style="animation-duration:13s;animation-delay:-6s"/>
    <circle class="f" cx="380" cy="0" r="2.8" style="animation-duration:9s;animation-delay:-8s"/>
    <circle class="f" cx="425" cy="0" r="1.4" style="animation-duration:12s;animation-delay:-4s"/>
    <circle class="f" cx="470" cy="0" r="2" style="animation-duration:8s;animation-delay:-10s"/>
    <circle class="f" cx="515" cy="0" r="1.6" style="animation-duration:14s;animation-delay:-12s"/>
    <circle class="f" cx="560" cy="0" r="1.2" style="animation-duration:10s;animation-delay:-1.5s"/>
    <circle class="f" cx="600" cy="0" r="2.4" style="animation-duration:11s;animation-delay:-6.5s"/>
    <circle class="f" cx="645" cy="0" r="1.5" style="animation-duration:7s;animation-delay:-3.5s"/>
    <circle class="f" cx="690" cy="0" r="2" style="animation-duration:13s;animation-delay:-9.5s"/>
    <circle class="f" cx="735" cy="0" r="1.3" style="animation-duration:9s;animation-delay:-7.5s"/>
    <circle class="f" cx="780" cy="0" r="2.6" style="animation-duration:12s;animation-delay:-2.5s"/>
    <circle class="f" cx="825" cy="0" r="1.7" style="animation-duration:8s;animation-delay:-11.5s"/>
    <circle class="f" cx="870" cy="0" r="1.2" style="animation-duration:14s;animation-delay:-4.5s"/>
    <circle class="f" cx="915" cy="0" r="2.2" style="animation-duration:10s;animation-delay:-8.5s"/>
    <circle class="f" cx="960" cy="0" r="1.5" style="animation-duration:11s;animation-delay:-5.5s"/>
    <circle class="f" cx="1005" cy="0" r="2.8" style="animation-duration:7s;animation-delay:-.5s"/>
    <circle class="f" cx="1050" cy="0" r="1.4" style="animation-duration:13s;animation-delay:-12.5s"/>
    <circle class="f" cx="1095" cy="0" r="2" style="animation-duration:9s;animation-delay:-6s"/>
    <circle class="f" cx="1140" cy="0" r="1.6" style="animation-duration:12s;animation-delay:-3s"/>
    <circle class="f" cx="1180" cy="0" r="1.2" style="animation-duration:8s;animation-delay:-10.5s"/>
    <circle class="f" cx="95" cy="0" r="2.4" style="animation-duration:14s;animation-delay:-1s"/>
    <circle class="f" cx="310" cy="0" r="1.5" style="animation-duration:10s;animation-delay:-7s"/>
    <circle class="f" cx="540" cy="0" r="2" style="animation-duration:11s;animation-delay:-4s"/>
    <circle class="f" cx="760" cy="0" r="1.3" style="animation-duration:7s;animation-delay:-9s"/>
    <circle class="f" cx="990" cy="0" r="2.6" style="animation-duration:13s;animation-delay:-2s"/>
  </g>
</svg>
